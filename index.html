<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <title>MyMusic — Neon Blue</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span>♫</span> MyMusic</div>
        <label class="search">
          <span>⌕</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Cari judul lagu..."
            aria-label="Cari lagu"
          />
        </label>
      </header>

      <main>
        <section class="hero">
          <div class="hero-cover">
            <img
              id="coverImg"
              src="cover/cover1.PNG"
              alt="Sampul lagu yang sedang diputar"
            />
          </div>
          <div class="hero-info">
            <span class="eyebrow">NOW PLAYING</span>
            <h1 id="songTitle">Pilih lagu</h1>
            <p id="songArtist">Koleksi musik Anda</p>
            <div class="hero-tags">
              <span id="songCategory">Lagu Jawa</span>
              <span id="playingStatus">Siap diputar</span>
            </div>
          </div>
        </section>

        <section class="library">
          <div class="section-heading">
            <div>
              <p class="eyebrow">KOLEKSI MUSIK</p>
              <h2 id="playlistTitle">Lagu Jawa</h2>
            </div>
            <span id="songCount">0 lagu</span>
          </div>

          <nav class="tabs" aria-label="Kategori musik">
            <button class="tab active" data-category="jawa">Lagu Jawa</button>
            <button class="tab" data-category="barat">Lagu Barat</button>
            <button class="tab" data-category="dj">Lagu DJ</button>
          </nav>

          <div class="list-heading">
            <span>#</span><span>Judul lagu</span>
            <span class="duration-heading">Durasi</span>
          </div>
          <ul id="playlist" class="playlist"></ul>
          <p id="emptyMessage" class="empty" hidden>
            Lagu tidak ditemukan atau belum tersedia.
          </p>
        </section>
      </main>

      <footer class="player">
        <div class="current-track">
          <img id="miniCover" src="cover/cover1.PNG" alt="Sampul mini" />
          <div class="current-text">
            <strong id="miniTitle">Pilih lagu</strong>
            <span id="miniArtist">MyMusic</span>
          </div>
        </div>

        <div class="player-center">
          <div class="controls">
            <button
              id="shuffleBtn"
              class="icon-btn secondary-btn"
              title="Acak lagu"
              aria-label="Acak lagu"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M16 3h5v5h-2V6.41l-4.3 4.3-1.4-1.42L17.59 5H16V3ZM3 7h3.5c1.4 0 2.6.7 3.4 1.8l5.7 7.4c.4.5 1 .8 1.6.8H21v2h-3.8c-1.3 0-2.5-.6-3.3-1.6l-5.7-7.5C7.8 9.3 7.2 9 6.5 9H3V7Zm13 10h1.6L16 15.4l1.4-1.4 3.6 3.5-3.6 3.5-1.4-1.4 1.6-1.6H16v-1Zm-5.8-7.6 1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1Z"
                />
              </svg>
            </button>

            <button
              id="prevBtn"
              class="icon-btn main-control"
              title="Lagu sebelumnya"
              aria-label="Lagu sebelumnya"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 5h2v14H6V5Zm13 0v14L8 12 19 5Z" />
              </svg>
            </button>

            <button
              id="playBtn"
              class="play-btn"
              title="Putar"
              aria-label="Putar lagu"
            >
              <svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7L8 5Z" />
              </svg>
            </button>

            <button
              id="nextBtn"
              class="icon-btn main-control"
              title="Lagu berikutnya"
              aria-label="Lagu berikutnya"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 5h2v14h-2V5ZM5 5l11 7-11 7V5Z" />
              </svg>
            </button>

            <button
              id="repeatBtn"
              class="icon-btn secondary-btn"
              title="Ulangi lagu"
              aria-label="Ulangi lagu"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M7 7h11l-3-3 1.4-1.4L22 8l-5.6 5.4L15 12l3-3H7a2 2 0 0 0-2 2v1H3v-1a4 4 0 0 1 4-4Zm10 10H6l3 3-1.4 1.4L2 16l5.6-5.4L9 12l-3 3h11a2 2 0 0 0 2-2v-1h2v1a4 4 0 0 1-4 4Z"
                />
              </svg>
            </button>
          </div>

          <div class="timeline">
            <span id="currentTime">0:00</span>
            <input
              id="seekBar"
              type="range"
              min="0"
              max="1000"
              value="0"
              aria-label="Posisi lagu"
            />
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="volume-control">
          <span aria-hidden="true">♫</span>
          <input
            id="volumeBar"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            aria-label="Volume"
          />
        </div>

        <audio id="audio" preload="metadata"></audio>
      </footer>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
